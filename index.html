<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Dashboard View (Current Month) -->
    <div id="dashboard-view" class="view">
        <div class="dashboard-header">
            <h1 class="app-title">Habit Tracker</h1>
            <button id="add-habit-btn" class="add-btn">+ Add Habit</button>
        </div>

        <div id="habits-container">
            <!-- JavaScript will generate habit cards here -->
        </div>
    </div>

    <!-- Modals (outside views so they work everywhere) -->
    <!-- Add Habit Modal -->
    <div id="add-habit-modal" class="modal hidden">
        <div class="modal-content">
            <h2>New Habit</h2>

            <label class="input-label">Habit Name</label>
            <input type="text" id="habit-name-input" placeholder="Enter habit name..." maxlength="30">

            <label class="input-label">Goal</label>
            <div class="goal-options">
                <label class="radio-option">
                    <input type="radio" name="goal-type" value="daily" checked>
                    <span>Daily</span>
                </label>

                <label class="radio-option">
                    <input type="radio" name="goal-type" value="weekly">
                    <span>Times per week</span>
                    <select id="weekly-value" class="goal-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </label>

                <label class="radio-option">
                    <input type="radio" name="goal-type" value="everyXDays">
                    <span>Once every</span>
                    <select id="every-x-days-value" class="goal-select">
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                    <span>days</span>
                </label>
            </div>

            <div class="modal-buttons">
                <button id="cancel-habit-btn" class="modal-btn cancel-btn">Cancel</button>
                <button id="save-habit-btn" class="modal-btn save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Edit Habit Modal -->
    <div id="edit-habit-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Edit Habit</h2>

            <label class="input-label">Habit Name</label>
            <input type="text" id="edit-habit-name-input" placeholder="Enter habit name..." maxlength="30">

            <label class="input-label">Goal</label>
            <div class="goal-options">
                <label class="radio-option">
                    <input type="radio" name="edit-goal-type" value="daily">
                    <span>Daily</span>
                </label>

                <label class="radio-option">
                    <input type="radio" name="edit-goal-type" value="weekly">
                    <span>Times per week</span>
                    <select id="edit-weekly-value" class="goal-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </label>

                <label class="radio-option">
                    <input type="radio" name="edit-goal-type" value="everyXDays">
                    <span>Once every</span>
                    <select id="edit-every-x-days-value" class="goal-select">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                    <span>days</span>
                </label>
            </div>

            <div class="modal-buttons">
                <button id="cancel-edit-btn" class="modal-btn cancel-btn">Cancel</button>
                <button id="save-edit-btn" class="modal-btn save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-habit-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Delete Habit</h2>
            <p class="modal-warning">This will permanently delete this habit and all its history. This action cannot be
                undone.</p>
            <p id="delete-habit-name" style="color: #e8b923; margin-bottom: 24px;"></p>
            <div class="modal-buttons">
                <button id="cancel-delete-btn" class="modal-btn cancel-btn">Cancel</button>
                <button id="confirm-delete-btn" class="modal-btn danger-save-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Year View (Full Year) -->
    <div id="year-view" class="view hidden">
        <div class="year-header">
            <div class="year-title-row">
                <button id="back-btn" class="view-btn">← Back</button>
                <div class="year-habit-info">
                    <span class="year-habit-name">Exercise</span>
                </div>
                <div class="year-habit-actions">
                    <button id="year-edit-btn" class="action-btn" title="Edit habit">Edit</button>
                    <button id="year-delete-btn" class="action-btn danger-btn" title="Delete habit">Delete</button>
                </div>
            </div>
            <div class="year-controls">
                <button id="prev-year-btn" class="arrow-btn">‹</button>
                <span id="year-display">2025</span>
                <button id="next-year-btn" class="arrow-btn">›</button>
            </div>
        </div>
        <div id="year-grid" class="year-grid">
            <!-- JavaScript will generate month columns here -->
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
