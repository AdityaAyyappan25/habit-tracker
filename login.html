<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #f5f5f5;
            font-family: 'Crimson Text', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #141414;
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #e8b923;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #888;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: inherit;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #e8b923;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #e8b923;
            color: #0a0a0a;
        }

        .btn-primary:hover {
            background: #f5d547;
        }

        .toggle-text {
            text-align: center;
            color: #666;
            margin-top: 20px;
        }

        .toggle-text a {
            color: #e8b923;
            cursor: pointer;
            text-decoration: none;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        .error {
            color: #c45c5c;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        .success {
            color: #5cb85c;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            flex: 1;
            padding-right: 60px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            color: #e8b923;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }

        .toggle-password:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>Habit Tracker</h1>
        <p class="subtitle" id="form-subtitle">Sign in to continue</p>

        <form id="auth-form">
            <div class="form-group" id="name-group" style="display: none;">
                <label>Username</label>
                <input type="text" id="username" placeholder="@username" maxlength="20">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                    <span class="toggle-password" onclick="togglePassword()">Show</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">Sign In</button>
        </form>

        <p class="error" id="error-msg"></p>
        <p class="success" id="success-msg"></p>

        <p class="toggle-text">
            <span id="toggle-text">Don't have an account?</span>
            <a id="toggle-link" onclick="toggleMode()">Sign Up</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        let isSignUp = false;

        // Check if already logged in
        async function checkAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        }
        checkAuth();

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-subtitle').textContent = isSignUp ? 'Create your account' : 'Sign in to continue';
            document.getElementById('submit-btn').textContent = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('toggle-text').textContent = isSignUp ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('toggle-link').textContent = isSignUp ? 'Sign In' : 'Sign Up';
            document.getElementById('name-group').style.display = isSignUp ? 'block' : 'none';
            hideMessages();
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('success-msg').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('success-msg').style.display = 'none';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('display-name').value;

            if (isSignUp) {
                // Sign Up
                const username = document.getElementById('username').value.trim();

                if (!username) {
                    showError('Please enter a username');
                    return;
                }

                const { data, error } = await sb.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            display_name: username,
                            username: username
                        }
                    }
                });

                if (error) {
                    showError(error.message);
                } else {
                    showSuccess('Account created! Check your email to confirm, then sign in.');
                }
            } else {
                // Sign In
                const { data, error } = await sb.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    showError(error.message);
                } else {
                    window.location.href = 'index.html';
                }
            }
        });
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleText = document.querySelector('.toggle-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleText.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleText.textContent = 'Show';
            }
        }
    </script>
</body>

</html>
